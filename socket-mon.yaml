---
- name: Monitor, Recreate, and Maintain Docker Socket Proxy Remotely
  hosts: all
  gather_facts: false

  vars:
    proxy_port: "2375"
    container_name: "socket-proxy"

  tasks:
    - name: Check if socket-proxy API is responding locally on target host
      ansible.builtin.command:
        cmd: "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:{{ proxy_port }}/_ping"
      register: proxy_ping_cmd
      changed_when: false
      ignore_errors: true

    - name: Display socket-proxy health status
      ansible.builtin.debug:
        msg: >-
          {{
            'socket-proxy on ' ~ inventory_hostname ~ ' is HEALTHY.'
            if proxy_ping_cmd.stdout == '200'
            else 'socket-proxy on ' ~ inventory_hostname ~ ' is UNHEALTHY or DOWN (HTTP ' ~ proxy_ping_cmd.stdout ~ '). Recreating container...'
          }}

    - name: Stop and remove socket-proxy if unhealthy or down
      community.docker.docker_container:
        name: "{{ container_name }}"
        state: absent
        force_kill: true
      when: proxy_ping_cmd.stdout != '200'

    - name: Recreate socket-proxy container
      community.docker.docker_container:
        name: "{{ container_name }}"
        image: lscr.io/linuxserver/socket-proxy:latest
        state: started
        restart_policy: unless-stopped
        read_only: true
        published_ports:
          - "2375:2375"
        volumes:
          - "/var/run/docker.sock:/var/run/docker.sock:ro"
        tmpfs:
          - "/run"
          - "/tmp"
          - "/config"
          - "/var/lib/haproxy"
        env:
          LOG_LEVEL: "warning"
          TZ: "Europe/London"
          CONTAINERS: "1"
          EVENTS: "1"
          IMAGES: "1"
          INFO: "1"
          NETWORKS: "1"
          PING: "1"
          VERSION: "1"
          VOLUMES: "1"
          LOGS: "1"
          POST: "1"
          START: "1"
          STOP: "1"
          RESTART: "1"
      when: proxy_ping_cmd.stdout != '200'
