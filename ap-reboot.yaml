---
- name: Reboot Network Access Points
  hosts: access_points
  gather_facts: false
  tasks:
    - name: Issue reboot command
      ansible.builtin.raw: reboot
      ignore_errors: true

    - name: Wait for AP to come back online
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: 22
        state: started
        delay: 15
        timeout: 300
      delegate_to: localhost
